<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#121213">
  <meta name="color-scheme" content="dark">
  <title>Squirdle</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="header">
    <button type="button" class="icon-button" id="archive-button" aria-label="Past puzzles" aria-haspopup="dialog" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13zM6 10h5v5H6z"/></svg>
    </button>
    <div class="heading">
      <h1 class="title">Squirdle</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <button type="button" class="icon-button" id="random-button" aria-label="Random puzzle" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 18c-.83 0-1.5-.67-1.5-1.5S6.67 15 7.5 15s1.5.67 1.5 1.5S8.33 18 7.5 18zm0-9C6.67 9 6 8.33 6 7.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9c-.83 0-1.5-.67-1.5-1.5S15.67 6 16.5 6s1.5.67 1.5 1.5S17.33 9 16.5 9z"/></svg>
    </button>
  </header>
  <main class="game">
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="board-container" id="board-container">
      <div class="board" id="board" role="grid" aria-label="Board"></div>
    </div>
    <div class="keyboard" id="keyboard" role="group" aria-label="Keyboard"></div>
  </main>
  <dialog class="archive" id="archive" aria-labelledby="archive-title">
    <div class="archive-panel">
      <div class="archive-header">
        <h2 class="archive-title" id="archive-title">Past puzzles</h2>
        <button type="button" class="icon-button" id="archive-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <ol class="archive-list" id="archive-list"></ol>
    </div>
  </dialog>
</body>
</html>
